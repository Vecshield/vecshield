# A secret-detection tool has to contain secret-shaped strings: the benchmark
# corpus, the detector tests and the demo estate all carry credentials that
# look real, because that is the only way to prove the detectors fire on them.
#
# Every value in these paths is synthetic or a vendor's own published test
# value (Stripe's `sk_test_4eC39HqLyjWDarjtT1zdp7dc`, GitHub's documented
# example token). None grants access to anything.
#
# This suppresses secret-scanning *alerts* for these paths. It does not affect
# push protection, which is handled per-secret through the bypass flow.
paths-ignore:
  - "benchmark/corpus/**"
  - "benchmarks/**"
  - "tests/**"
  - "demo/scenarios.py"
  - "demo/WALKTHROUGH.md"
  - "examples/**"
  - "vecshield_platform/api/dashboard/dist/assets/dashboard.js"
  - "vecshield_platform/api/dashboard/tests/**"
