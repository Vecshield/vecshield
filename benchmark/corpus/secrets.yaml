# Secrets: real-shaped credentials, and the things that look exactly like them.
#
# Every value here is synthetic or published by its vendor as an example. None
# authenticates against anything. `expect: sensitive` means a detector should
# flag it; `expect: clean` means flagging it is a false positive.
items:
  - id: secret-aws-live
    text: "export AWS_ACCESS_KEY_ID=AKIA2X4YQ7NBVCXZ9WQ1"
    expect: sensitive
    labels: [secret]
    reason: "Shaped as a live AWS access key id and not a published example."
    decided_by: seed

  - id: secret-aws-docs
    text: "Use the example credentials AKIAIOSFODNN7EXAMPLE when following this guide."
    expect: sensitive
    labels: [secret]
    disputed_by: [published_example]
    reason: >
      AWS prints this key in its own documentation. A detector should still
      flag the shape, but must say it is a published example — a reviewer
      who is not told that wastes a rotation.
    decided_by: seed

  - id: secret-aws-secret-docs
    text: "aws_secret_access_key = wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY"
    expect: sensitive
    labels: [secret]
    disputed_by: [published_example]
    reason: "The AWS documentation secret key."
    decided_by: seed

  - id: secret-stripe-test
    text: "Billing sandbox uses sk_test_4eC39HqLyjWDarjtT1zdp7dc for smoke tests."
    expect: sensitive
    labels: [secret]
    disputed_by: [vendor_test_prefix]
    reason: "Stripe reserves sk_test_ for test mode; it cannot move money."
    decided_by: seed

  - id: secret-in-fixture-collection
    text: "token = ghp_1234567890abcdefghijklmnopqrstuvwxyz"
    collection: test_fixtures
    expect: sensitive
    labels: [secret]
    disputed_by: [non_production_scope]
    reason: "Shaped like a GitHub token, in a collection labelled as fixtures."
    decided_by: seed

  - id: secret-quoted-guidance
    text: "Never paste a key like `AKIA1234567890ABCDEF` into a support ticket."
    expect: sensitive
    labels: [secret]
    disputed_by: [quoted_in_text]
    reason: >
      Security guidance about keys, quoting one. A detector that cannot tell
      this from a leak floods the queue with its own documentation.
    decided_by: seed

  - id: clean-base64-blob
    text: "Thumbnail payload: iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8"
    expect: clean
    reason: "Base64 image data. High entropy, no credential."
    decided_by: seed

  - id: clean-uuid
    text: "Correlation id 3f2504e0-4f89-11d3-9a0c-0305e82c3301 for this request."
    expect: clean
    reason: "A UUID is not a secret."
    decided_by: seed

  - id: clean-git-sha
    text: "Deployed commit 9f2c4a1b8e7d6c5f4a3b2c1d0e9f8a7b6c5d4e3f to production."
    expect: clean
    reason: "A commit hash looks random and authenticates nothing."
    decided_by: seed

  - id: clean-key-word-no-key
    text: "Please rotate the API key in the vault before Friday."
    expect: clean
    reason: "Talks about a key without containing one."
    decided_by: seed

  # ------------------------------------------------------------------ #
  # Expansion, September 18, 2026.
  #
  # Written to test whether `aws_access_key` deserves a confidence class,
  # which is the gate an irreversible delete waits on. Because the expansion
  # exists to open a gate, the hard negatives were written FIRST and
  # deliberately: strings shaped to trip the detector, drawn from the things
  # that actually surround a key in a real repository. Adding only positives
  # would have manufactured a precision rather than measured one.
  #
  # Each distinct case appears once. Where the same value is rephrased to
  # check that context does not change the answer, the rephrasings declare
  # `variant_of` and count as a single observation.
  # ------------------------------------------------------------------ #

  # --- hard negatives: shaped like a key, and not one ---------------- #
  - id: secret-aws-neg-short
    text: "Ticket AKIA2X4YQ7NBVCXZ9WQ references the migration plan."
    expect: clean
    reason: "AKIA prefix but 15 trailing characters, not 16. Not a key shape."
    decided_by: seed

  - id: secret-aws-neg-lowercase
    text: "The akia2x4yq7nbvcxz9wq1 branch was merged last week."
    expect: clean
    reason: "Lowercase. AWS key ids are uppercase; a case-insensitive match here is a false positive."
    decided_by: seed

  - id: secret-aws-neg-base64
    text: "Checksum: QUtJQTJYNFlRN05CVkNYWjlXUTE9PQ== for the release tarball."
    expect: clean
    reason: "A base64 blob of similar length and alphabet. Flagging it is a false positive."
    decided_by: seed

  - id: secret-aws-neg-uuid
    text: "Correlation id AKIA0000-1111-2222-3333-444455556666 in the trace."
    expect: clean
    reason: "A UUID that happens to begin with the prefix. Hyphens break the key shape."
    decided_by: seed

  - id: secret-aws-neg-sha
    text: "Commit 8f14e45fceea167a5a36dedd4bea2543c7f2a0b1 broke the build."
    expect: clean
    reason: "A 40-character hex hash. Long, high-entropy, and not a credential."
    decided_by: seed

  - id: secret-aws-neg-prose
    text: "Our AKIA keys are rotated every ninety days by the platform team."
    expect: clean
    reason: "Discusses keys without containing one. A policy document must not be flagged."
    decided_by: seed

  - id: secret-aws-neg-variable
    text: "aws_access_key_id = ${AWS_ACCESS_KEY_ID}"
    expect: clean
    reason: "A variable reference, which is the correct pattern. Flagging it punishes good practice."
    decided_by: seed

  - id: secret-aws-neg-redacted
    text: "aws_access_key_id = AKIA****************"
    expect: clean
    reason: "Already redacted. Nothing is exposed and there is nothing to rotate."
    decided_by: seed

  - id: secret-aws-neg-asana
    text: "See ASANA2X4YQ7NBVCXZ9WQ1 for the rollout checklist."
    expect: clean
    reason: "A different 20-character uppercase token. Length alone must not trigger it."
    decided_by: seed

  - id: secret-aws-neg-anonymised
    text: "The incident report cites AKIAXXXXXXXXXXXXXXXX as the compromised id."
    expect: clean
    disputed_by: [placeholder_token]
    reason: >
      An anonymised placeholder in a post-mortem. It is a valid key *shape*,
      deliberately, which is why it is the hardest negative here: nothing is
      exposed and there is nothing to rotate, so a reviewer sent to this chunk
      has no work to do.
    decided_by: seed

  # --- true positives: distinct cases, not rewordings ---------------- #
  - id: secret-aws-terraform
    text: "provider \"aws\" { access_key = \"AKIA5TQ2NHBGVCXZ9WQ1\" region = \"us-east-1\" }"
    expect: sensitive
    labels: [secret]
    reason: "A live-shaped key checked into Terraform, which is where they usually leak."
    decided_by: seed

  - id: secret-aws-json-config
    text: "{\"credentials\": {\"awsAccessKeyId\": \"AKIA7PLM3QWERTYU8ZX2\", \"region\": \"eu-west-2\"}}"
    expect: sensitive
    labels: [secret]
    reason: "A key in a serialized configuration blob."
    decided_by: seed

  - id: secret-aws-log-line
    text: "2026-03-04T11:02:14Z WARN auth failed for AKIA9ZXCVBNM1234QWER retrying"
    expect: sensitive
    labels: [secret]
    reason: "A key leaked into an application log, a common ingestion path into a RAG store."
    decided_by: seed

  - id: secret-aws-runbook-prose
    text: "If the nightly sync stalls, re-run it with AKIA4RTYUIOP7890ASDF and escalate to platform."
    expect: sensitive
    labels: [secret]
    reason: "A key embedded in runbook prose rather than in a config block."
    decided_by: seed

  - id: secret-aws-csv-row
    text: "prod-sync,AKIA6MNBVCXZ1234POIU,us-west-1,active,2025-11-02"
    expect: sensitive
    labels: [secret]
    reason: "A key in a tabular export, where surrounding punctuation differs from config syntax."
    decided_by: seed

  - id: secret-aws-code-comment
    text: "# TODO: move AKIA8QAZWSXEDCRFV123 into the secret manager before launch"
    expect: sensitive
    labels: [secret]
    reason: "A key in a source comment, with an acknowledgement that it should not be there."
    decided_by: seed

  - id: secret-aws-ticket-body
    text: "Customer pasted their credentials into chat: AKIA3EDCRFVTGBYHN567. Rotate and confirm."
    expect: sensitive
    labels: [secret]
    reason: "A key inside a support ticket, which is how they reach a knowledge base."
    decided_by: seed

  - id: secret-aws-env-file
    text: "AWS_ACCESS_KEY_ID=AKIA1POIUYTREWQ0987L\nAWS_DEFAULT_REGION=ap-south-1"
    expect: sensitive
    labels: [secret]
    reason: "A key in a dotenv file alongside a benign variable."
    decided_by: seed

  # --- one case, three phrasings: context must not change the answer -- #
  - id: secret-aws-ctx-plain
    text: "AKIA0LKJHGFDSAZXCVB1"
    expect: sensitive
    labels: [secret]
    variant_of: secret-aws-context-invariance
    reason: "The key with no surrounding text."
    decided_by: seed

  - id: secret-aws-ctx-sentence
    text: "The value AKIA0LKJHGFDSAZXCVB1 is still active in the staging account."
    expect: sensitive
    labels: [secret]
    variant_of: secret-aws-context-invariance
    reason: "The same key in a sentence. Counts as the same case, not a second one."
    decided_by: seed

  - id: secret-aws-ctx-quoted
    text: "He wrote: \"AKIA0LKJHGFDSAZXCVB1\" and then deleted the message."
    expect: sensitive
    labels: [secret]
    variant_of: secret-aws-context-invariance
    reason: "The same key in quotation marks. Still one case."
    decided_by: seed
