name: Feature request
description: Propose a capability or a change in behaviour.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that you cannot do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
  - type: textarea
    id: alternatives
    attributes:
      label: What you tried or considered instead
